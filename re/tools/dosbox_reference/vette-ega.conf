# DOSBox Staging (0.83+) configuration for VETTE! reference captures.
#
# Matches the machine that vette_run emulates: an EGA card, a CPU that the game classifies
# like a 12 MHz 286, PC speaker only, no joystick. The game drive, capture directory, key map
# and DOS clock are set on the command line by capture_reference.py, so this file holds no
# paths. Load it with --noprimaryconf so the user's own settings don't leak in.

[sdl]
fullscreen = false
# capture_reference.py passes mapperfile=vette-capture.map: the stock Ctrl+F5 screenshot hotkey
# would also press Ctrl in the game, so the map takes screenshots on a plain F12 (not passed to
# the game) and keeps every other key at its default binding, with no joystick or other hotkeys.

[dosbox]
machine = ega
memsize = 16

[cpu]
core = normal
cputype = auto
# DOSBox Staging's ballpark table says 1500 cycles/ms for a 12 MHz 286, but DOSBox counts every
# instruction as one cycle. VETTE's CPU probe (detect_cpu_class, 3009:0E28) times an IDIV loop
# (5 instructions, ~46 clocks on a 286): a real 12 MHz 286 and vette_run do ~260K iterations/s,
# just under the 262144 "fast" threshold, so the rear-view mirror and building windows start off.
# At 1500 DOSBox does 300K/s and turns them on. 1200 (240K/s) gives the same CPU class.
cpu_cycles = 1200
cpu_cycles_protected = auto

[dos]
# US date format for the DATE command, and a US keyboard so scan codes map 1:1.
country = 1
keyboard_layout = us

[capture]
# "raw" saves the unscaled emulated framebuffer as an indexed PNG
# (640x200 for the mode 0Eh menus, 320x200 for the mode 0Dh screens).
default_image_capture_formats = raw

[mixer]
# No host audio; the PC speaker is still emulated.
nosound = true

# VETTE! only uses the PC speaker; keep other sound hardware out of the way.
[sblaster]
sbtype = none
oplmode = none

[midi]
mididevice = none
mpu401 = none

[joystick]
# vette_run has no joystick (port 201h reads FFh); don't let a host gamepad reach the game port.
joysticktype = disabled

[mouse]
# Never grab the host mouse; the game must not see host mouse motion.
mouse_capture = nomouse

[webserver]
# Lets the capture script read emulated memory (BIOS video mode, timer).
webserver_enabled = on
